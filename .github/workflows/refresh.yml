name: weekly-refresh
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC (post-weekend Euroleague games)
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: echo "refresh pipeline stub — wired up in Week 4"
