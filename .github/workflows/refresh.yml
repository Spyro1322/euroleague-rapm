# .github/workflows/refresh.yml
# Weekly refresh of the CURRENT-FORM dashboard pipeline (2021:2025 window only).
# The all-time career fit + its bootstrap are a one-off, NOT part of this weekly job.
#
# CONFIRM before enabling:
#   - script flags below match your CLIs (esp. ingest_pbp.py incremental/resume flags)
#   - DASH_ALPHA = the CV-selected alpha the FIRST rapm_dash fit logged (pin it so the
#     cron doesn't re-CV onto a neighbouring flat-curve grid point as data grows)
#   - deps install path (pyproject vs requirements.txt)
# HF Spaces push is a Week-5 item -- commented TODO at the end.

name: weekly-refresh
on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC
  workflow_dispatch: {}           # manual trigger

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  DASH_ALPHA: "3162.3"               # <-- set to rapm_dash's logged CV alpha before enabling
  CURRENT_SEASON: "2025"          # start-year of the in-progress season

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .            # or: pip install -r requirements.txt

      - name: Incremental ingest (current season only)
        run: python scripts/ingest_pbp.py --seasons ${{ env.CURRENT_SEASON }}
        # resume-safe; only the in-progress season is re-pulled.
        # Do NOT pull shots here -- the API rate-limits (429) under concurrent load.

      - name: Rebuild warehouse + stints + league averages
        run: |
          python scripts/build_warehouse.py
          python scripts/build_stint_matrix.py
          python scripts/build_league_averages.py

      - name: Design + fit + bootstrap (dashboard window, one step)
        run: |
          python scripts/build_rapm_design.py --seasons 2021:2025 --prefix rapm_dash
          python scripts/fit_ridge_rapm.py \
            --prefix rapm_dash --bootstrap 500 --alpha ${{ env.DASH_ALPHA }} --out rapm_dash

      - name: Commit refreshed artifact
        run: |
          git config user.name  "refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          # warehouse/ is gitignored; force-add only the render-model output.
          git add -f warehouse/rapm_dash.parquet
          git commit -m "weekly refresh: rapm_dash $(date -u +%F)" || echo "no changes"
          git push

      # - name: Deploy to Hugging Face Space   # <-- Week 5
      #   env:
      #     HF_TOKEN: ${{ secrets.HF_TOKEN }}
      #   run: python scripts/push_to_hf.py