[project]
name = "elrapm"
version = "0.1.0"
description = "Play-type-conditional & lineup-pair-synergy RAPM for the Euroleague (MSc thesis, UCAM)"
requires-python = ">=3.11"
dependencies = [
    "euroleague-api==0.1.1",
    "duckdb>=1.1",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "pymc>=5.16",
    "arviz>=0.18",
    "streamlit>=1.37",
    "plotly>=5.23",
    "altair>=5.3",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
